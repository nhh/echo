# cargo-deny: Lizenzen, Sicherheitsmeldungen, Herkunft und die Regel
# "reines Rust" (CLAUDE.md 5). Laeuft in CI und vor jedem Commit.

[graph]
# Der Client ist eine Windows-Exe, der Server laeuft auch unter Linux.
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Alles, was sich mit MIT in einer Exe ausliefern laesst.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "MPL-2.0",
]
confidence-threshold = 0.9
# Die Liste gilt fuer den ganzen Port, nicht nur fuer die Crates von heute.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Pfade zwischen den eigenen, unveroeffentlichten Crates sind keine Wildcards.
allow-wildcard-paths = true
# Reines Rust: nichts, was C, C++ oder Assembler baut oder mitbringt.
deny = [
  { crate = "ring", reason = "C und Assembler; echo-quic bringt den Provider mit" },
  { crate = "aws-lc-rs", reason = "C; echo-quic bringt den Provider mit" },
  { crate = "aws-lc-sys", reason = "C" },
  { crate = "openssl-sys", reason = "C" },
  { crate = "libsqlite3-sys", reason = "C; turso_core nehmen" },
  { crate = "turso", reason = "zieht mimalloc, simsimd und bindgen; turso_core nehmen" },
  { crate = "libmimalloc-sys", reason = "C" },
  { crate = "simsimd", reason = "C" },
  { crate = "audiopus_sys", reason = "C; Opus in Rust nehmen" },
  { crate = "ffmpeg-sys-next", reason = "C, und echo kommt ohne ffmpeg aus" },
  { crate = "cmake", reason = "baut C oder C++" },
  { crate = "bindgen", reason = "bindet C ein" },
  { crate = "nasm-rs", reason = "Assembler" },
  # aegis bringt cc mit, bricht sein Build-Skript mit `pure-rust` aber ab,
  # bevor etwas kompiliert wird (echo-226).
  { crate = "cc", wrappers = ["aegis"], reason = "baut C; nur unter aegis mit pure-rust geduldet" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
