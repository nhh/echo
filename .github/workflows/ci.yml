# Format, Lints, Tests mit Abdeckung (mindestens 60 % Zeilen), cargo-deny
# und die Commit-Nachrichten. Was hier rot wird, ist auch lokal rot
# (CLAUDE.md 1).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pull Requests: der neue Stand ersetzt den alten. Auf main laeuft jeder
# Push zu Ende, sonst steht ein abgebrochener Lauf als Fehler in der Liste.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests mit Abdeckung (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --fail-under-lines 60 --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov-${{ matrix.os }}
          path: lcov.info

  deny:
    name: cargo-deny (Lizenzen, Advisories, reines Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  commits:
    name: Commit-Nachrichten
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-commits.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
